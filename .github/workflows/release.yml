name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

env:
  GO_VERSION: '1.24'

jobs:
  # Nothing is published until the full gate passes in both engines. A release
  # that skips the browser tests has not been verified at all.
  gate:
    name: verify before releasing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium firefox
      - name: Verify
        run: ./scripts/verify.sh

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"

          BASE="slidepack_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "build/$BASE"

          BIN="slidepack"
          [ "$GOOS" = "windows" ] && BIN="slidepack.exe"

          # -trimpath keeps absolute build paths out of the binary, which is
          # the same principle the packed-file format follows: nothing about
          # the machine that produced an artifact belongs inside it.
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "build/$BASE/$BIN" ./cmd/slidepack

          cp README.md "build/$BASE/"
          if [ -f LICENSE ]; then cp LICENSE "build/$BASE/"; fi
          mkdir -p "build/$BASE/docs"
          cp docs/format-v1.md docs/source-format.md "build/$BASE/docs/"

          mkdir -p dist
          cd build
          if [ "$GOOS" = "windows" ]; then
            zip -qr "../dist/${BASE}.zip" "$BASE"
          else
            tar czf "../dist/${BASE}.tar.gz" "$BASE"
          fi
          cd ..
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: staging
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd staging
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && VERSION="${{ github.event.inputs.tag }}"
          cat > NOTES.md <<NOTES
          ## slidepack ${VERSION}

          A single static executable. No Node.js, no Python, no npm, no runtime
          of any kind — the browser bootstrap is compiled into the binary.

          \`\`\`bash
          slidepack pack ./quarterly-review -o quarterly-review.html
          open quarterly-review.html
          \`\`\`

          Packed files open directly from \`file://\` in current Firefox and
          Chromium with no server, no extension and no network. This release
          was published only after the full gate passed, including the browser
          end-to-end suites in both engines.

          Writes **slidepack format version 1** — see
          [docs/format-v1.md](docs/format-v1.md).

          ### Install

          Download the archive for your platform, verify it against
          \`SHA256SUMS\`, and put \`slidepack\` on your \`PATH\`.

          \`\`\`bash
          sha256sum --check --ignore-missing SHA256SUMS
          \`\`\`

          Or build from source:

          \`\`\`bash
          go install github.com/pwagstro/slidepack/cmd/slidepack@${GITHUB_REF_NAME}
          \`\`\`

          ### Verifying what you downloaded

          The SHA-256 sums here cover the release archives. Note that the
          digests *inside* a packed presentation are integrity checks against
          corruption, not signatures — they say nothing about who produced a
          file. Only open presentations from sources you trust.
          NOTES
          cat NOTES.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: NOTES.md
          files: staging/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          fail_on_unmatched_files: true
