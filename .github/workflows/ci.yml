name: CI

on:
  push:
    branches: [main]
  pull_request:

# The browser suites are the only check that a packed file actually renders,
# so CI runs the same gate a developer runs locally: ./scripts/verify.sh.
jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium firefox

      - name: Verify
        run: ./scripts/verify.sh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: tests/browser/playwright-report/
          retention-days: 7

  reproducible:
    name: reproducible output across machines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Packing the same tree twice, from two different working directories
      # and with the timestamps disturbed in between, must produce identical
      # bytes. Absolute paths and mtimes must not leak into the output.
      - name: Pack twice and compare
        run: |
          set -euo pipefail
          go build -ldflags "-X main.version=ci" -o /tmp/slidepack ./cmd/slidepack
          cp -R testdata/browser /tmp/copy-a
          cp -R testdata/browser /tmp/copy-b
          find /tmp/copy-b -exec touch -t 199901010000 {} +
          /tmp/slidepack pack /tmp/copy-a -o /tmp/a.html --quiet
          /tmp/slidepack pack /tmp/copy-b -o /tmp/b.html --quiet
          cmp /tmp/a.html /tmp/b.html
          echo "packed output is reproducible"
