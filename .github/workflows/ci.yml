name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'

jobs:
  # The full local gate, unchanged: gofmt, go vet, every Go test, a CLI smoke
  # test against the built binary, and Playwright in both target engines.
  #
  # The browser suites are the only check that a packed file actually renders,
  # so they run on every push rather than being reserved for releases.
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm ci --no-audit --no-fund

      # Cache the browser binaries: they are ~200 MB and change only when the
      # Playwright version in package-lock.json does.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/browser/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium firefox

      - name: Verify
        run: ./scripts/verify.sh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          retention-days: 7

  # Windows has no Playwright job here because the packed-file guarantees are
  # about the browser, not the host. What Windows must get right is path
  # handling, so it runs the Go suite, which is where those rules live.
  windows:
    name: go test (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - run: go test ./...

  lint:
    name: staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  # Packing the same tree twice, from two different absolute paths and with
  # the timestamps disturbed in between, must produce identical bytes.
  # Neither the working directory nor the filesystem clock may leak into the
  # output.
  reproducible:
    name: reproducible output
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Pack twice from different paths and compare
        run: |
          set -euo pipefail
          go build -ldflags "-X main.version=ci" -o /tmp/slidepack ./cmd/slidepack
          cp -R testdata/browser /tmp/copy-a
          cp -R testdata/browser /tmp/a-considerably-longer-directory-name-b
          find /tmp/a-considerably-longer-directory-name-b -exec touch -t 199901010000 {} +
          /tmp/slidepack pack /tmp/copy-a -o /tmp/a.html --quiet
          /tmp/slidepack pack /tmp/a-considerably-longer-directory-name-b -o /tmp/b.html --quiet
          if ! cmp /tmp/a.html /tmp/b.html; then
            echo "::error::packed output is not reproducible across paths and mtimes"
            exit 1
          fi
          echo "packed output is reproducible ($(wc -c < /tmp/a.html) bytes)"

      - name: Round trip is byte-exact
        run: |
          set -euo pipefail
          /tmp/slidepack unpack /tmp/a.html -o /tmp/restored --quiet
          diff -r /tmp/copy-a /tmp/restored
          echo "round trip is byte-exact"

  # Reproducibility across operating systems, not just across runs.
  #
  # slidepack records file modes, and Windows has no POSIX permission bits --
  # Go reports 0666 there for every writable file. Modes are canonicalised when
  # the source tree is read so that the same presentation packs to the same
  # bytes everywhere; this job is the evidence. .gitattributes keeps the
  # checkout itself byte-identical, without which the comparison would be
  # measuring line endings.
  cross-platform-output:
    name: pack on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Pack the fixture
        shell: bash
        run: |
          set -euo pipefail
          BIN=./slidepack
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=./slidepack.exe; fi
          # A fixed version string so the generator field in the manifest is
          # the same on every runner.
          go build -trimpath -ldflags "-X main.version=reproducibility-check" -o "$BIN" ./cmd/slidepack
          "$BIN" pack testdata/browser -o packed.html --quiet
          "$BIN" inspect packed.html

      - uses: actions/upload-artifact@v4
        with:
          name: packed-${{ matrix.os }}
          path: packed.html
          if-no-files-found: error
          retention-days: 3

  compare-platforms:
    name: output is identical on every platform
    needs: cross-platform-output
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packed-*
          path: artifacts

      - name: Compare
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum */packed.html

          reference=""
          status=0
          for dir in packed-*; do
            if [ -z "$reference" ]; then
              reference="$dir"
              continue
            fi
            if ! cmp -s "$reference/packed.html" "$dir/packed.html"; then
              echo "::error::$dir packed different bytes from $reference"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Packing is meant to be reproducible across operating systems."
            exit 1
          fi
          echo "every platform produced identical bytes"

  # The published interface description must stay valid: agents parse it.
  interface:
    name: machine-readable interface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Machine-readable interface is intact
        run: |
          go build -o /tmp/slidepack ./cmd/slidepack
          ./scripts/check-interface.py /tmp/slidepack
